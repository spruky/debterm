name: apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: sdk 35
        run: yes | sdkmanager --install "platforms;android-35" "build-tools;35.0.0" >/dev/null

      # proot, its ptrace loader and libtalloc come from the Termux apt repo and
      # land in jniLibs as lib*.so, because nativeLibraryDir is the only place an
      # app is allowed to exec from.
      - name: proot payload
        run: |
          set -eux
          sudo apt-get -qq update
          sudo apt-get -qq install -y patchelf binutils xz-utils zstd
          M=https://packages.termux.dev/apt/termux-main
          D="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$D"
          W=$(mktemp -d)
          cd "$W"
          curl -fsSL "$M/dists/stable/main/binary-aarch64/Packages" -o P
          for pkg in proot libtalloc libandroid-shmem; do
            f=$(awk -v RS='' -v p="Package: $pkg" 'index($0, p "\n") == 1 {print}' P | awk '/^Filename:/{print $2; exit}')
            test -n "$f"
            curl -fsSL "$M/$f" -o "$pkg.deb"
            mkdir -p "x/$pkg"
            cd "x/$pkg"
            ar x "$W/$pkg.deb"
            tar -xf data.tar.xz || tar --zstd -xf data.tar.zst || tar -xf data.tar.gz
            cd "$W"
          done
          U=x/proot/data/data/com.termux/files/usr
          T=x/libtalloc/data/data/com.termux/files/usr
          S=x/libandroid-shmem/data/data/com.termux/files/usr
          cp    "$U/bin/proot"              "$D/libproot.so"
          cp    "$U/libexec/proot/loader"   "$D/libloader.so"
          cp    "$U/libexec/proot/loader32" "$D/libloader32.so" || true
          cp -L "$T/lib/libtalloc.so.2"     "$D/libtalloc.so"
          cp -L "$S/lib/libandroid-shmem.so" "$D/libshmem.so"
          # Every DT_NEEDED must be either a platform library or a file we ship,
          # and the soname has to end in .so or the installer drops it.
          patchelf --replace-needed libtalloc.so.2 libtalloc.so "$D/libproot.so"
          patchelf --replace-needed libandroid-shmem.so libshmem.so "$D/libproot.so"
          patchelf --set-rpath '$ORIGIN' "$D/libproot.so"
          chmod 755 "$D"/*.so
          for n in $(readelf -d "$D/libproot.so" | awk -F'[][]' '/NEEDED/{print $2}'); do
            case "$n" in
              libc.so|libdl.so|libm.so|liblog.so|libandroid.so) ;;
              *) test -f "$D/$n" || { echo "unshipped dependency: $n"; exit 1; } ;;
            esac
          done
          readelf -d "$D/libproot.so" | grep -E 'NEEDED|RUNPATH'
          ls -l "$D"

      # Built straight with NDK clang: no CMake, no externalNativeBuild, no
      # ndkVersion to drift.
      - name: libpty.so
        run: |
          set -eux
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1 || true)
          fi
          if [ -z "$NDK" ]; then
            yes | sdkmanager --install "ndk;27.2.12479018" >/dev/null
            NDK="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          "$CC" -O2 -fPIC -shared -Wl,-z,max-page-size=16384 \
            -o app/src/main/jniLibs/arm64-v8a/libpty.so app/src/main/cpp/pty.c
          ls -l app/src/main/jniLibs/arm64-v8a/libpty.so

      # proot-distro stopped shipping rootfs tarballs, so we make our own from
      # the official arm64 image. gzip, not xz: GZIPInputStream is already in the
      # platform, an xz decoder is not. The name must NOT end in .gz — aapt2
      # gunzips such assets and strips the extension, so v1.0.3 shipped a
      # 100 MB assets/rootfs.tar the app never looked for.
      - name: debian rootfs
        run: |
          set -eux
          mkdir -p app/src/main/assets
          rm -f app/src/main/assets/rootfs.*
          docker pull -q --platform linux/arm64 debian:bookworm-slim
          cid=$(docker create --platform linux/arm64 debian:bookworm-slim)
          docker export "$cid" | gzip -6 > app/src/main/assets/rootfs.bin
          docker rm -f "$cid"
          ls -lh app/src/main/assets

      - name: build
        run: |
          set -eux
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk debterm.apk
          # The payload has to reach the device under the name the app opens, and
          # gzipped: aapt2 rewrites .gz assets, so check the apk, not the source.
          unzip -l debterm.apk | grep -E 'assets/|lib/arm64'
          unzip -l debterm.apk | grep -q 'assets/rootfs.bin'
          unzip -p debterm.apk assets/rootfs.bin | head -c2 | od -An -tx1 | grep -q '1f 8b'
          # Same code at targetSdk 28, in case a device still refuses to exec
          # under a modern target. Same package name, so it replaces the other.
          ./gradlew :app:assembleRelease --no-daemon -Pdebterm.targetSdk=28
          cp app/build/outputs/apk/release/app-release.apk debterm-sdk28.apk
          ls -lh debterm.apk debterm-sdk28.apk

      - uses: actions/upload-artifact@v4
        with:
          name: debterm-apk
          path: |
            debterm.apk
            debterm-sdk28.apk
          if-no-files-found: error

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          gh release create "v1.0.${{ github.run_number }}" debterm.apk debterm-sdk28.apk \
            --title "debterm v1.0.${{ github.run_number }}" \
            --notes "Debian bookworm terminal, arm64-v8a. Install debterm.apk; use debterm-sdk28.apk only if the first one cannot exec." \
            --latest
